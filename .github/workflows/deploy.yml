name: Deploy to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yashvi-bagga-productions/package-lock.json

      - name: Install dependencies
        working-directory: yashvi-bagga-productions
        run: npm ci

      - name: Build website
        working-directory: yashvi-bagga-productions
        run: npm run build

      - name: Deploy to public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./yashvi-bagga-productions/dist/yashvi-bagga-productions/browser/
          server-dir: ./
          dangerous-clean-slate: false
