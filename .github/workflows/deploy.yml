name: Deploy to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Angular)
        run: npm ci

      - name: Build website (Angular)
        run: npm run build

      - name: Install dependencies (Kanyadan)
        working-directory: ./kanyadan
        run: npm install --legacy-peer-deps

      - name: Build Kanyadan (Next.js Static Export)
        working-directory: ./kanyadan
        run: npm run build

      - name: Copy Kanyadan build into Angular dist
        run: cp -r ./kanyadan/out ./yashvi-bagga-productions/dist/yashvi-bagga-productions/browser/kanyadan

      - name: Deploy to public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./yashvi-bagga-productions/dist/yashvi-bagga-productions/browser/
          server-dir: ./
          dangerous-clean-slate: false
