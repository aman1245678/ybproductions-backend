name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: Fail on files over 500 LOC
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "LOC gate failed: $file has $lines lines"
              bad=1
            fi
          done < <(find yashvi-bagga-productions/src -type f \( -name '*.ts' -o -name '*.html' -o -name '*.scss' \) ! -path '*/node_modules/*')
          exit $bad

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm run typecheck
        run: npm run typecheck

  test-server:
    name: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm run test:server
        run: npm run test:server
      - name: Upload server coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: coverage/server

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm run test:unit
        run: npm run test:unit
      - name: Upload unit coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: yashvi-bagga-productions/coverage

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm outdated
        run: npm outdated || true
      - name: npm audit
        run: npm audit --audit-level=high

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-server, test-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
